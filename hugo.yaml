baseURL: https://truster.dev/
languageCode: en-us
title: Truster

module:
  imports:
    - path: github.com/imfing/hextra
  mounts:
    - source: content
      target: content
    - source: static
      target: static
    - source: ../truster/docs
      target: content/docs
    - source: ../truster/schema
      target: static/schema

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  description: Truster is a minimal OIDC provider that lets your team authenticate to Kubernetes clusters using their existing Google or GitHub accounts.
  externalLinkDecoration: true
  search:
    enable: true
    type: flexsearch
  analytics:
    umami:
      serverURL: "https://cloud.umami.is"
      websiteID: "a28e96fc-f759-40f0-a6ce-7f53d2ba223c"
      scriptName: "script.js"
  navbar:
    displayLogo: true
    displayTitle: false
    logo:
      path: truster-logo.svg
      dark: truster-logo-dark.svg
      width: 110
      height: 46
  customCSS:
    - css/custom.css
  footer:
    displayPoweredBy: false

menu:
  main:
    - name: Search
      weight: 1
      params:
        type: search
    - name: Community Forum
      weight: 5
      url: "https://forum.podplane.dev"
      params:
        icon: chat
    - name: GitHub
      weight: 10
      url: "https://github.com/truster-dev/truster"
      params:
        icon: github
  sidebar:
    - name: GitHub
      url: "https://github.com/truster-dev/truster"
      weight: 1

outputs:
  home: [html, llms]
